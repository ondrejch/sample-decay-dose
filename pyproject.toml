[build-system]
build-backend = "setuptools.build_meta"
requires = ["setuptools>=61"]

[project]
name = "sample_decay_dose"
version = "0.1.0"
description = "Calculate a dose from a decaying sample using SCALE"
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "Ondrej Chvala", email = "ochvala@utexas.edu" }]
keywords = ["health physics", "dose", "SCALE"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Intended Audience :: Science/Research",
    "Topic :: Scientific/Engineering :: Physics",
]
requires-python = ">=3.10"
dependencies = [
    "numpy",
    "joblib",
    "json5",
    "pandas>=2.2",
    "xlsxwriter>=3.0.5",
    "jinja2>=3.1.2",
    "numexpr>=2.8.4",
    "bottleneck>=1.3.6",
    "matplotlib",
    "requests",
    "requests-file",
]

[project.urls]
Homepage = "https://github.com/ondrejch/sample-decay-dose"
"Bug Tracker" = "https://github.com/ondrejch/sample-decay-dose/issues"

[tool.setuptools.packages.find]
include = ["sample_decay_dose*"]

[tool.setuptools.package-data]
sample_decay_dose = ["data/*.json", "data/*.html"]
