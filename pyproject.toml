[build-system]
build-backend = "setuptools.build_meta"
requires = ["setuptools>=61"]

[project]
name = "sample_decay_dose"
version = "0.1.0"
description = "Calculate a dose from a decaying sample using SCALE"
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "Ondrej Chvala", email = "ochvala@utexas.edu" }]
keywords = ["health physics", "dose", "SCALE"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Intended Audience :: Science/Research",
    "Topic :: Scientific/Engineering :: Physics",
]
requires-python = ">=3.10"
dependencies = [
    "numpy",
    "joblib",
    "json5",
    "pandas>=2.2",
    "xlsxwriter>=3.0.5",
    "jinja2>=3.1.2",
    "numexpr>=2.10.2",
    "bottleneck>=1.4.2",
    "matplotlib",
    "requests",
]

[project.optional-dependencies]
test = ["pytest"]
# scipy is used by examples/co_stellite/pb_steel_irr_plot_hcdoses_gamma.py and play/PaSep-ThEIRENE.py.
# The co_stellite and cobalt_steel examples also need MSRRpy, which is installed separately.
examples = ["scipy"]
# Regenerating the DCF tables with leaky_box_origen/extract_fgr11_dcf.py and extract_icrp72_dcf.py.
dcf-extract = ["scipy", "Pillow"]

[project.scripts]
scalerte-ssh-agent = "sample_decay_dose.gw_exe.scalerte_ssh_agent:main"
scalerte-ssh = "sample_decay_dose.gw_exe.scalerte_ssh_client:main"

[project.urls]
Homepage = "https://github.com/ondrejch/sample-decay-dose"
"Bug Tracker" = "https://github.com/ondrejch/sample-decay-dose/issues"

[tool.setuptools.packages.find]
include = ["sample_decay_dose*", "leaky_box_origen*"]

[tool.setuptools.package-data]
sample_decay_dose = ["data/*.json", "data/*.html"]
leaky_box_origen = ["data/*.csv"]
